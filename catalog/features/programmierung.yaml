area: programmierung
features:
  - id: programmierung.kontrollstrukturen
    title: Kontrollstrukturen
    group: programmierung.sprache
    summary: "Verzweigungen und Schleifen in Structured Text: IF/ELSIF/ELSE, CASE mit Bereichen, FOR, WHILE, REPEAT, EXIT, CONTINUE, RETURN."
    usage:
      - channel: entwicklung
        text: Im Programmtext (IEC 61131-3 Structured Text).
    technical:
      components: [src/vplc/st/parser.py, src/vplc/st/compiler.py]
    acceptance:
      - id: verzweigungen
        kind: effekt
        text: IF/ELSIF/ELSE und CASE mit Einzelwerten, Listen, Bereichen und ELSE wählen den richtigen Zweig.
      - id: schleifen
        kind: effekt
        text: FOR (auch rückwärts mit BY), WHILE und REPEAT liefern die erwarteten Ergebnisse; EXIT und CONTINUE wirken.
      - id: return
        kind: effekt
        text: RETURN beendet den Zyklus; folgende Anweisungen werden nicht ausgeführt.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_if_elsif_else, covers: [verzweigungen] }
      - { kind: unit, file: tests/test_st_language.py, test: test_case_with_ranges_and_lists, covers: [verzweigungen] }
      - { kind: unit, file: tests/test_st_language.py, test: test_loops, covers: [schleifen] }
      - { kind: unit, file: tests/test_st_language.py, test: test_return_ends_scan, covers: [return] }
    comparisons: { themenliste: vplc }

  - id: programmierung.datentypen
    title: Datentypen wie auf der SPS
    group: programmierung.sprache
    summary: 16 elementare Datentypen mit SPS-typischem Überlauf, REAL in 32 Bit und allen gängigen Literalformen.
    usage:
      - channel: entwicklung
        text: "Deklaration z. B. `Drehzahl : INT := 100;`, Literale wie `16#FF`, `2#1010`, `INT#5`, `T#1m30s`."
    rules:
      - Ganzzahlen laufen wie auf der Steuerung über (32767 + 1 = −32768).
      - REAL wird auf 32-Bit-Genauigkeit gerundet.
    technical:
      components: [src/vplc/types.py, src/vplc/st/lexer.py, src/vplc/st/compiler.py]
    acceptance:
      - id: ueberlauf
        kind: regel
        text: INT, BYTE und UINT laufen an ihren Grenzen über.
      - id: real-32bit
        kind: regel
        text: REAL hat 32-Bit-Genauigkeit, LREAL 64 Bit.
      - id: literale
        kind: effekt
        text: Hexadezimal-, Binär-, typisierte, Zeit- und Exponent-Literale ergeben die erwarteten Werte.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_integer_overflow_wraps_like_a_plc, covers: [ueberlauf] }
      - { kind: unit, file: tests/test_st_language.py, test: test_real_is_float32, covers: [real-32bit] }
      - { kind: unit, file: tests/test_st_language.py, test: test_literals, covers: [literale] }
    comparisons: { themenliste: vplc }

  - id: programmierung.ausdruecke
    title: Ausdrücke und Operatoren
    group: programmierung.sprache
    summary: Arithmetik, Vergleiche, logische und bitweise Verknüpfungen mit IEC-Vorrangregeln; Namen ohne Rücksicht auf Groß-/Kleinschreibung.
    usage:
      - channel: entwicklung
        text: "Operatoren `+ - * / MOD **`, `= <> < > <= >=`, `AND & OR XOR NOT`; Kommentare `(* … *)` und `//`."
    technical:
      components: [src/vplc/st/parser.py, src/vplc/st/compiler.py]
    acceptance:
      - id: vorrang
        kind: effekt
        text: Punkt- vor Strichrechnung, Klammern, ganzzahlige Division und MOD rechnen wie auf der SPS.
      - id: logik-bitweise
        kind: effekt
        text: AND/OR/XOR/NOT wirken auf BOOL logisch und auf WORD bitweise.
      - id: schreibweise
        kind: effekt
        text: Variablennamen sind unabhängig von Groß-/Kleinschreibung; Kommentare werden ignoriert.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_arithmetic_and_precedence, covers: [vorrang] }
      - { kind: unit, file: tests/test_st_language.py, test: test_boolean_and_bitwise_logic, covers: [logik-bitweise] }
      - { kind: unit, file: tests/test_st_language.py, test: test_case_insensitive_identifiers_and_comments, covers: [schreibweise] }
    comparisons: { themenliste: vplc }

  - id: programmierung.variablenbereiche
    title: Variablenbereiche und Konstanten
    group: programmierung.sprache
    summary: VAR, VAR_INPUT, VAR_OUTPUT, VAR_TEMP und Konstanten, die andere Konstanten nutzen dürfen.
    usage:
      - channel: entwicklung
        text: "`VAR CONSTANT MAX : INT := 10; END_VAR`; `VAR_TEMP` wird in jedem Zyklus neu initialisiert."
    technical:
      components: [src/vplc/st/compiler.py]
    acceptance:
      - id: temp-und-var
        kind: effekt
        text: VAR_TEMP beginnt jeden Zyklus mit dem Initialwert, VAR behält seinen Wert über Zyklen.
      - id: konstanten-ausdruecke
        kind: effekt
        text: Initialwerte dürfen aus zuvor deklarierten Konstanten berechnet werden.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_var_temp_is_reset_each_scan_and_var_keeps_value, covers: [temp-und-var] }
      - { kind: unit, file: tests/test_st_language.py, test: test_constants_in_initialisers, covers: [konstanten-ausdruecke] }
    comparisons: { themenliste: vplc }

  - id: programmierung.timer
    title: Zeitglieder TON, TOF, TP
    group: programmierung.bibliothek
    summary: Einschalt-, Ausschaltverzögerung und Impuls nach IEC 61131-3.
    usage:
      - channel: entwicklung
        text: "`t(IN := Start, PT := T#5s); IF t.Q THEN …`"
    technical:
      components: [src/vplc/st/stdlib.py]
    acceptance:
      - id: ton
        kind: effekt
        text: TON setzt Q genau nach Ablauf von PT und meldet die abgelaufene Zeit ET; ohne IN wird zurückgesetzt.
      - id: tof
        kind: effekt
        text: TOF hält Q nach dem Abschalten von IN noch für PT.
      - id: tp
        kind: effekt
        text: TP erzeugt einen Impuls der Länge PT, auch wenn IN vorher abfällt.
    evidence:
      - { kind: unit, file: tests/test_function_blocks.py, test: test_ton, covers: [ton] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_tof, covers: [tof] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_tp, covers: [tp] }
    comparisons: { themenliste: vplc }

  - id: programmierung.zaehler-flanken
    title: Zähler, Flanken und Speicherglieder
    group: programmierung.bibliothek
    summary: CTU, CTD, CTUD, R_TRIG, F_TRIG, SR und RS.
    usage:
      - channel: entwicklung
        text: "`c(CU := Teil.Q, R := Quittieren, PV := 10);`"
    technical:
      components: [src/vplc/st/stdlib.py]
    acceptance:
      - id: flanken
        kind: effekt
        text: R_TRIG meldet nur die steigende, F_TRIG nur die fallende Flanke.
      - id: zaehler
        kind: effekt
        text: CTU zählt steigende Flanken bis PV und wird mit R zurückgesetzt; CTD zählt vom geladenen PV abwärts.
      - id: auf-ab
        kind: effekt
        text: CTUD zählt auf und ab, meldet QU/QD, lädt PV mit LD und setzt mit R zurück; gleichzeitige Flanken heben sich auf.
      - id: speicher
        kind: effekt
        text: Bei gleichzeitigem Setzen und Rücksetzen dominiert bei SR das Setzen, bei RS das Rücksetzen.
    evidence:
      - { kind: unit, file: tests/test_function_blocks.py, test: test_edges, covers: [flanken] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_ctu_and_reset, covers: [zaehler] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_ctd, covers: [zaehler] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_sr_rs, covers: [speicher] }
      - { kind: unit, file: tests/test_function_blocks.py, test: test_ctud_counts_up_and_down_with_load_and_reset, covers: [auf-ab] }
    comparisons: { themenliste: vplc }

  - id: programmierung.funktionen
    title: Standardfunktionen und Typumwandlungen
    group: programmierung.bibliothek
    summary: MIN, MAX, LIMIT, SEL, ABS, SQRT und weitere Funktionen sowie alle *_TO_*-Umwandlungen.
    usage:
      - channel: entwicklung
        text: "`Ist := LIMIT(0, Soll, 100); r := INT_TO_REAL(i);`"
    rules:
      - REAL_TO_INT rundet kaufmännisch statt abzuschneiden.
    technical:
      components: [src/vplc/st/stdlib.py]
    acceptance:
      - id: funktionen
        kind: effekt
        text: MAX, LIMIT, SQRT, SEL, ABS und TO_DINT liefern die erwarteten Werte.
      - id: runden
        kind: regel
        text: REAL_TO_INT rundet 2,5 auf 2 und −2,6 auf −3.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_functions_and_conversions, covers: [funktionen, runden] }
    comparisons: { themenliste: vplc }

  - id: programmierung.programm-pruefen
    title: Programm prüfen
    group: programmierung.pruefung
    summary: Prüft Structured Text vor dem Laden und meldet alle Fehler mit Zeile und Spalte – im Browser, per API oder in der CI.
    usage:
      - channel: api
        text: "`POST /api/check` mit `source` → `{ok, errors[]}`."
      - channel: cli
        text: "`vplc check programm.st` – Rückgabewert 1 bei Fehlern, Ausgabe `datei:zeile:spalte: Meldung`."
    technical:
      components: [src/vplc/st/compiler.py, src/vplc/st/parser.py, src/vplc/__main__.py, src/vplc/manager/api.py]
      endpoints: ["POST /api/check"]
      commands: [vplc check]
    acceptance:
      - id: position
        kind: effekt
        text: Ein Syntaxfehler wird mit der richtigen Zeile gemeldet.
      - id: alle-fehler
        kind: effekt
        text: Mehrere semantische Fehler (unbekannte Variable, Typ, Funktion, Konstante beschrieben …) werden gemeinsam und nach Zeile sortiert gemeldet.
      - id: cli
        kind: effekt
        text: "`vplc check` meldet für eine fehlerhafte Datei `datei:3:1: Unbekannte Variable` und endet mit 1, für eine fehlerfreie mit 0."
      - id: api
        kind: effekt
        text: Über die API geprüfte Beispielprogramme gelten als fehlerfrei.
    evidence:
      - { kind: unit, file: tests/test_st_language.py, test: test_syntax_error_has_position, covers: [position] }
      - { kind: unit, file: tests/test_st_language.py, test: test_semantic_errors_are_collected, covers: [alle-fehler] }
      - { kind: integration, file: tests/test_operation_api.py, test: test_cli_check_reports_errors_with_line_and_column, covers: [cli] }
      - { kind: integration, file: tests/test_api.py, test: test_check_endpoint_and_examples, covers: [api] }
    comparisons: { themenliste: industrial-devops }

  - id: programmierung.beispiele
    title: Beispielprogramme
    group: programmierung.pruefung
    summary: Liefert mitgelieferte Beispielprogramme (Ampel, Tank, Förderband) zum Laden in eine vPLC.
    usage:
      - channel: api
        text: "`GET /api/info` listet Beispiele und Funktionsbausteine, `GET /api/examples/{name}` liefert den Quelltext."
    rules:
      - "Pfadangaben außerhalb des Beispielordners werden mit `404` abgelehnt."
    technical:
      components: [src/vplc/manager/api.py]
      endpoints: ["GET /api/info", "GET /api/examples/{name}"]
      notes: [Beispiele unter `examples/*.st`; Ordner über `VPLC_EXAMPLES` änderbar.]
    acceptance:
      - id: beispiele-geliefert
        kind: effekt
        text: Die Beispiele ampel, tank und foerderband werden aufgelistet und als Quelltext geliefert.
      - id: kein-ausbruch
        kind: regel
        text: Ein Pfad außerhalb des Beispielordners wird abgelehnt.
        code: "404"
    evidence:
      - { kind: integration, file: tests/test_api.py, test: test_check_endpoint_and_examples, covers: [beispiele-geliefert, kein-ausbruch] }
    comparisons: { themenliste: vplc }

  - id: programmierung.arrays
    title: Arrays
    group: programmierung.sprache
    summary: Eindimensionale Arrays elementarer Typen mit beliebiger Untergrenze, Initialwertlisten und Indexzugriff.
    usage:
      - channel: entwicklung
        text: "`Werte : ARRAY[0..9] OF INT := [1, 2, 8(0)];` – Zugriff `Werte[i]`, Kopie `b := a;`."
    rules:
      - Ein Index außerhalb der Grenzen ist ein Laufzeitfehler (die vPLC geht in STOP).
      - Ganze Arrays lassen sich nur gleichartigen Arrays zuweisen.
      - Mehrdimensionale Arrays, Arrays von Bausteinen und Arrays als Baustein-Ein-/Ausgang sind noch nicht möglich.
    technical:
      components: [src/vplc/st/parser.py, src/vplc/st/compiler.py]
    acceptance:
      - id: init-index-schleife
        kind: effekt
        text: Initialwerte mit Wiederholung (`3(10)`), Untergrenze ≠ 0, Lesen und Schreiben per Index in Schleifen liefern die erwarteten Werte.
      - id: index-grenze
        kind: regel
        text: Ein Index außerhalb der Grenzen bricht mit Meldung und Zeilennummer ab.
      - id: kopie
        kind: regel
        text: Eine Array-Zuweisung kopiert die Werte; ungleiche Arrays werden beim Prüfen abgelehnt.
      - id: deklarationsfehler
        kind: regel
        text: Zu viele Initialwerte, vertauschte Grenzen, fehlender Index und Index auf Nicht-Arrays werden gemeldet.
    evidence:
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_arrays_with_initial_values_indices_and_loops, covers: [init-index-schleife] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_array_index_out_of_range_is_runtime_error, covers: [index-grenze] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_whole_array_copy_requires_same_shape, covers: [kopie] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_array_declaration_errors, covers: [deklarationsfehler] }
    comparisons: { themenliste: vplc }

  - id: programmierung.eigene-funktionsbausteine
    title: Eigene Funktionsbausteine
    group: programmierung.bausteine
    summary: FUNCTION_BLOCKs mit Ein-/Ausgängen und Gedächtnis; jede Instanz hat eigene Werte und darf weitere Bausteine enthalten.
    description: |
      Bausteine werden im selben Quelltext wie das Programm deklariert, in beliebiger Reihenfolge.
      Sie können Standardbausteine wie TON oder andere eigene Bausteine enthalten. Wird ein Programm im RUN
      neu geladen, behalten Instanzen ihre Werte und laufen mit dem neuen Code.
    usage:
      - channel: entwicklung
        text: "`FUNCTION_BLOCK Zaehler … END_FUNCTION_BLOCK`; Instanz `a : Zaehler;`, Aufruf `a(Takt := t, Stand => x);`, Ausgang `a.Stand`."
      - channel: api
        text: Ein- und Ausgänge der Instanzen erscheinen in der Variablenliste (z. B. `m.MITTEL`).
    rules:
      - Ein Baustein darf sich nicht selbst (auch nicht über andere) enthalten.
      - Unbekannte Ein- und Ausgänge werden beim Prüfen gemeldet.
    technical:
      components: [src/vplc/st/compiler.py, src/vplc/st/parser.py, src/vplc/runtime.py]
      endpoints: ["GET /api/plcs/{plc_id}/variables"]
    acceptance:
      - id: eigene-werte
        kind: effekt
        text: Zwei Instanzen zählen unabhängig; Ausgänge sind über `=>` und `instanz.Ausgang` lesbar; ein enthaltener TON läuft mit der Zeit der vPLC.
      - id: warmstart
        kind: effekt
        text: Nach dem Nachladen eines geänderten Bausteins behält die Instanz ihren Stand und rechnet mit dem neuen Code.
      - id: fehler
        kind: regel
        text: Unbekannte Ein- oder Ausgänge und ein sich selbst enthaltender Baustein werden gemeldet.
      - id: in-api
        kind: effekt
        text: Die Ausgänge einer Bausteininstanz erscheinen in der Variablenliste der API.
    evidence:
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_user_function_block_instances_have_their_own_state, covers: [eigene-werte] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_warm_restart_keeps_fb_state_but_runs_new_code, covers: [warmstart] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_member_access_and_errors_of_user_function_blocks, covers: [fehler] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_recursion_and_self_containing_function_blocks_are_rejected, covers: [fehler] }
      - { kind: integration, file: tests/test_arrays_protocols.py, test: test_arrays_and_function_blocks_through_the_api, covers: [in-api] }
    comparisons: { themenliste: vplc }

  - id: programmierung.eigene-funktionen
    title: Eigene Funktionen
    group: programmierung.bausteine
    summary: FUNCTIONs ohne Gedächtnis mit Positions- oder benannten Argumenten, Vorgabewerten und Rückgabe über den Funktionsnamen.
    usage:
      - channel: entwicklung
        text: "`FUNCTION Skaliere : REAL … END_FUNCTION`; Aufruf `Skaliere(r)` oder `Skaliere(Roh := r, Max := 50.0)`."
    rules:
      - Rekursion (auch über andere Funktionen) wird abgelehnt.
      - Funktionen enthalten keine Bausteininstanzen; lokale Variablen und Ausgänge beginnen bei jedem Aufruf neu.
    technical:
      components: [src/vplc/st/compiler.py, src/vplc/st/parser.py]
    acceptance:
      - id: aufruf
        kind: effekt
        text: Positions-, benannte und weggelassene Argumente (Vorgabewert) liefern das erwartete Ergebnis; RETURN beendet die Funktion vorzeitig.
      - id: kein-gedaechtnis
        kind: regel
        text: Zwei gleiche Aufrufe liefern dasselbe Ergebnis, weil lokale Variablen neu beginnen.
      - id: aufruffehler
        kind: regel
        text: Zu viele Argumente, unbekannte Eingänge und ein Aufruf ohne Klammern werden gemeldet.
      - id: rekursion
        kind: regel
        text: Ein Aufrufkreis A → B → A wird mit der Kette gemeldet.
      - id: deklaration
        kind: regel
        text: Reservierte Namen, doppelte Namen und Bausteininstanzen in Funktionen sowie ein fehlendes oder doppeltes PROGRAM werden gemeldet.
    evidence:
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_user_functions_with_positional_named_and_default_arguments, covers: [aufruf, kein-gedaechtnis] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_function_call_errors, covers: [aufruffehler] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_recursion_and_self_containing_function_blocks_are_rejected, covers: [rekursion] }
      - { kind: unit, file: tests/test_st_pou_arrays.py, test: test_pou_declaration_errors, covers: [deklaration] }
    comparisons: { themenliste: vplc }

  - id: programmierung.strings
    title: Zeichenketten (STRING)
    group: programmierung.sprache
    summary: STRING und STRING[n] mit IEC-Escapes, Vergleichen, den Standard-Stringfunktionen und Umwandlungen in beide Richtungen.
    usage:
      - channel: entwicklung
        text: "`Meldung : STRING[60] := 'Bereit';` – `CONCAT`, `LEN`, `LEFT`, `RIGHT`, `MID`, `FIND`, `INSERT`, `DELETE`, `REPLACE`, `INT_TO_STRING`, `STRING_TO_REAL` …"
    rules:
      - Zu lange Texte werden auf die deklarierte Länge gekürzt (Standard 254 Zeichen, wie bei S7).
      - Positionen beginnen bei 1; die Reihenfolge der Parameter folgt IEC 61131-3 (z. B. `MID(IN, L, P)`).
      - Ungültige Positionen und nicht lesbare Zahlen sind Laufzeitfehler.
    technical:
      components: [src/vplc/types.py, src/vplc/st/lexer.py, src/vplc/st/stdlib.py]
    acceptance:
      - id: funktionen
        kind: effekt
        text: Escapes, Kürzen auf STRING[8], LEN, FIND, LEFT, RIGHT, MID, INSERT, DELETE, REPLACE, CONCAT und Vergleiche liefern die erwarteten Werte.
      - id: umwandlung
        kind: effekt
        text: Zahlen und BOOL werden in Text umgewandelt und Text in Zahlen (auch mit Komma).
      - id: fehler
        kind: regel
        text: Position 0 bei MID, ein nicht lesbarer Zahltext, eine Länge über 254 und Text in doppelten Anführungszeichen werden gemeldet.
    evidence:
      - { kind: unit, file: tests/test_structs_strings.py, test: test_strings_literals_escapes_length_and_functions, covers: [funktionen] }
      - { kind: unit, file: tests/test_structs_strings.py, test: test_string_conversions_both_ways, covers: [umwandlung] }
      - { kind: unit, file: tests/test_structs_strings.py, test: test_string_errors, covers: [fehler] }
    comparisons: { themenliste: vplc }

  - id: programmierung.strukturen
    title: Strukturen (STRUCT / UDT)
    group: programmierung.sprache
    summary: Eigene Datentypen mit Feldern und Startwerten – verschachtelt, mit Array-Feldern und als Arrays von Strukturen.
    description: |
      Strukturen werden in einem TYPE-Block im selben Quelltext deklariert. Zugriff über Pfade wie
      `Faecher[i].Ort.X`; ganze Strukturen lassen sich gleichartigen Strukturen zuweisen (Kopie).
      Beim Nachladen im RUN bleiben Werte erhalten, solange sich der Aufbau der Struktur nicht ändert.
    usage:
      - channel: entwicklung
        text: "`TYPE Fach : STRUCT Menge : INT := 1; Ort : Position; END_STRUCT; END_TYPE` – Zugriff `Faecher[i].Menge`."
      - channel: api
        text: "Werte als JSON-Objekt mit den deklarierten Feldnamen; Schreiben einzelner Felder (`Ziel.X`) oder teilweise (`{\"X\": 1}`)."
    rules:
      - Startwerte kommen aus der Typdeklaration; Strukturen als Baustein-Ein-/Ausgang oder Rückgabewert sind noch nicht möglich.
      - Eine Struktur darf sich nicht selbst enthalten.
    technical:
      components: [src/vplc/datatypes.py, src/vplc/st/parser.py, src/vplc/st/compiler.py]
    acceptance:
      - id: verschachtelt
        kind: effekt
        text: Feld-Startwerte, verschachtelte Strukturen, Array-Felder und Arrays von Strukturen lassen sich lesen und schreiben; Zuweisungen kopieren.
      - id: fehler
        kind: regel
        text: Selbstbezug, Struktur als Baustein-Eingang oder Rückgabewert, Initialwert an der Variable, unbekannte Felder, fehlendes Feld und ungleiche Strukturen werden gemeldet.
      - id: warmstart
        kind: effekt
        text: Beim Nachladen bleiben Strukturwerte erhalten; ändert sich der Aufbau, beginnt die Variable neu.
    evidence:
      - { kind: unit, file: tests/test_structs_strings.py, test: test_structs_with_defaults_nesting_and_arrays_of_structs, covers: [verschachtelt] }
      - { kind: unit, file: tests/test_structs_strings.py, test: test_struct_errors, covers: [fehler] }
