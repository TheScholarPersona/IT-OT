[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-ot-vplc"
version = "0.1.0"
description = "Virtuelle SPS (IEC 61131-3 Structured Text) mit S7comm- und OPC-UA-Schnittstelle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-snap7>=3.0",
  "asyncua>=1.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
vplc = "vplc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vplc = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
