services:
  vplc:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # Weboberfläche/REST – nur lokal, davor Reverse-Proxy mit TLS
      - "10102-10111:10102-10111" # S7comm (Port 102 im Container nicht ohne Root möglich)
      - "4840-4849:4840-4849"     # OPC UA
    environment:
      # Ohne Token ist die API offen. Für jeden Netzwerkbetrieb setzen!
      VPLC_API_TOKEN: ${VPLC_API_TOKEN:-}
    volumes:
      - vplc-data:/data

  node-red:
    build: ./node-red
    restart: unless-stopped
    depends_on:
      - vplc
    ports:
      - "127.0.0.1:1880:1880"     # Node-RED-Editor – ohne adminAuth nur lokal veröffentlichen
    environment:
      TZ: Europe/Berlin
      VPLC_URL: http://vplc:8080  # im Konfigurations-Node als ${VPLC_URL} verwenden
      VPLC_API_TOKEN: ${VPLC_API_TOKEN:-}
    volumes:
      - node-red-data:/data

volumes:
  vplc-data:
  node-red-data:
